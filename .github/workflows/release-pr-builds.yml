name: Release PR builds

on:
  workflow_call:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  release-pr-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/toolkit-checkout
      - uses: $/.github/actions/checkout
        with:
          # Spell the candidate ref explicitly, because a plain pull_request wake would ride the default to the unrebased head
          ref: ${{ format('refs/heads/candidate/{0}', github.event.pull_request.number) }}
          fetch-depth: 0
          fetch-tags: true
      - uses: $/.github/actions/setup-uv
      - run: uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev release --channel pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
