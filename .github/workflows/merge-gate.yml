name: Merge gate

on:
  workflow_call:
    secrets:
      merge-bot-private-key:
        description: Merge-bot GitHub App private key
        required: true

permissions:
  contents: read
  packages: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/toolkit-checkout
      - uses: $/.github/actions/consumer-checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full clone without tags, so merge-gate can validate that this PR is a fast forward from dev
          fetch-depth: 0
      - uses: $/.github/actions/setup-uv
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: mint
        with:
          app-id: ${{ vars.MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.merge-bot-private-key }}
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
      - run: uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev merge-gate --head-sha ${{ github.event.pull_request.head.sha }}
        env:
          GITHUB_TOKEN: ${{ steps.mint.outputs.token }}
          REGISTRY: ghcr.io/${{ github.repository }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
