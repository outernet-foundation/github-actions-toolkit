name: Mirror images

on:
  workflow_call:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  mirror-images:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: $/.github/actions/checkout
        with:
          # Spell the candidate ref explicitly, because a plain pull_request wake would ride the default to the unrebased head
          ref: ${{ format('refs/heads/candidate/{0}', github.event.pull_request.number) }}
      - uses: $/.github/actions/setup-uv
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: uv run --locked boatyard mirror
