name: Preflight

on:
  workflow_call:
    inputs:
      consumer-script:
        description: Run the consumer's scripts/preflight.py (false for repos with no Python)
        type: boolean
        default: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/toolkit-checkout
      - uses: $/.github/actions/checkout
        with:
          # Spell the candidate ref explicitly, because a plain pull_request wake would ride the default to the unrebased head
          ref: ${{ format('refs/heads/candidate/{0}', github.event.pull_request.number) }}
          fetch-depth: 0
          fetch-tags: true
      - uses: $/.github/actions/setup-uv
      - run: uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev lint-workflows
      - run: uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev validate-release-plan
      - run: uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev sync-contributor-docs --check
      - run: uv sync --locked
        if: inputs.consumer-script
      - run: uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev generate-github-workflows --check
      - run: uv run --locked scripts/preflight.py
        if: inputs.consumer-script
        env:
          GITHUB_TOKEN: ${{ github.token }}
