name: Build unity

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels for the fanout legs, as a JSON array string
        required: false
        default: '["ubuntu-latest"]'
        type: string
      unity-environment:
        description: Environment preset name applied by playerbuild; empty leaves the workspace untouched
        required: false
        default: ''
        type: string
    secrets:
      unity-email:
        description: Unity license email
        required: true
      unity-password:
        description: Unity license password
        required: true
      unity-serial:
        description: Unity license serial
        required: true
      android-keystore:
        description: Base64-encoded Android signing keystore for player builds
        required: true
      android-keystore-password:
        description: Password of the Android signing keystore
        required: true
      android-key-alias:
        description: Key alias inside the Android signing keystore
        required: true
      android-key-password:
        description: Password of the Android signing key alias
        required: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan-unity-builds:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      license-cache-key: ${{ steps.license-cache-key.outputs.license-cache-key }}
      commit-count: ${{ steps.commit-count.outputs.commit-count }}
    steps:
      - uses: $/.github/actions/toolkit-checkout
      - uses: $/.github/actions/consumer-checkout
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: $/.github/actions/setup-uv
      - id: license-cache-key
        run: echo "license-cache-key=$(uv run --locked unity-license-tag)" >> "$GITHUB_OUTPUT"
      - id: commit-count
        run: echo "commit-count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - id: matrix
        run: uv run --locked build-unity-matrix | uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev matrix

  build-unity:
    needs: [plan-unity-builds]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    container: ${{ matrix.editor-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-unity-builds.outputs.matrix) }}
    steps:
      - name: Wipe workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete; rm -rf ~/.cache/Unity
      - uses: $/.github/actions/consumer-checkout
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: $/.github/actions/setup-uv
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Materialize Android keystore
        run: test -z "$ANDROID_KEYSTORE" && exit 0; printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$KEYSTORE_PATH"
        env:
          ANDROID_KEYSTORE: ${{ secrets.android-keystore }}
          KEYSTORE_PATH: ${{ runner.temp }}/android-signing.keystore
      - run: >-
          uv run --locked build-unity
          --project "$PROJECT"
          --platform "$PLATFORM"
          --version "$VERSION"
          --pr-number "$PR_NUMBER"
          --commit-count "$COMMIT_COUNT"
          --license-cache-key "$LICENSE_CACHE_KEY"
          --environment-preset "$UNITY_ENVIRONMENT"
          --registry "$REGISTRY"
        env:
          PROJECT: ${{ matrix.project }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ matrix.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_COUNT: ${{ needs.plan-unity-builds.outputs.commit-count }}
          LICENSE_CACHE_KEY: ${{ needs.plan-unity-builds.outputs.license-cache-key }}
          UNITY_ENVIRONMENT: ${{ inputs.unity-environment }}
          UNITY_EMAIL: ${{ secrets.unity-email }}
          UNITY_PASSWORD: ${{ secrets.unity-password }}
          UNITY_SERIAL: ${{ secrets.unity-serial }}
          KEYSTORE_PATH: ${{ runner.temp }}/android-signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.android-keystore-password }}
          KEYSTORE_ALIAS: ${{ secrets.android-key-alias }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.android-key-password }}
          REGISTRY: ghcr.io/${{ github.repository }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
