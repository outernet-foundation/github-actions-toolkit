name: Integrate

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  rebase:
    permissions:
      contents: write
      pull-requests: read
    uses: $/.github/workflows/rebase.yml
  preflight:
    needs: [rebase]
    uses: $/.github/workflows/preflight.yml
  merge-if-ready:
    needs: [preflight]
    permissions:
      contents: write
      pull-requests: read
      packages: write
    concurrency:
      group: landing
      queue: max
    uses: $/.github/workflows/merge-if-ready.yml
    with:
      retry-workflow: _retry.yml
    secrets:
      merge-bot-private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
