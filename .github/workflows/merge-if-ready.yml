name: Merge if ready

on:
  workflow_call:
    inputs:
      retry-workflow:
        description: Filename of the consumer's retry dispatch shim
        required: false
        default: retry.yml
        type: string
    secrets:
      merge-bot-private-key:
        description: Merge-bot GitHub App private key
        required: true

permissions:
  contents: read
  pull-requests: read
  packages: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  merge-if-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/toolkit-checkout
      - uses: $/.github/actions/checkout
        with:
          fetch-depth: 0
      - uses: $/.github/actions/setup-uv
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: mint
        with:
          app-id: ${{ vars.MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.merge-bot-private-key }}
          permission-contents: write
          permission-pull-requests: read
          permission-actions: write
      - run: uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev merge-if-ready
        env:
          GITHUB_TOKEN: ${{ steps.mint.outputs.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RETRY_WORKFLOW: ${{ inputs.retry-workflow }}
          REGISTRY: ghcr.io/${{ github.repository }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
