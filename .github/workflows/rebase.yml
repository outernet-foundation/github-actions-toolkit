name: Rebase

on:
  workflow_call:
    outputs:
      mode:
        description: The run's CI mode — full, reuse, or idle
        value: ${{ jobs.rebase.outputs.mode }}

permissions:
  contents: write
  pull-requests: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  rebase:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.rebase.outputs.mode }}
    steps:
      - uses: $/.github/actions/toolkit-checkout
      - uses: $/.github/actions/checkout
        with:
          # Check out the frozen payload head, never a stale candidate ref
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: $/.github/actions/setup-uv
      - run: uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev rebase
        id: rebase
        env:
          GITHUB_TOKEN: ${{ github.token }}
