# Generated by generate-github-workflows: do not edit
name: Integrate

'on':
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/gate.yml@<generator-sha>
    permissions:
      contents: write
      pull-requests: write
    secrets:
      merge-bot-token: ${{ secrets.MERGE_BOT_TOKEN }}

  preflight:
    needs: [gate]
    if: ${{ needs.gate.outputs.mode == 'full' }}
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@<generator-sha>
    permissions:
      contents: read
    with:
      head-checkout: false

  build-unity-plan-unity-builds:
    needs: [gate, preflight]
    if: ${{ needs.gate.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      license-cache-key: ${{ steps.license-cache-key.outputs.license-cache-key }}
      commit-count: ${{ steps.commit-count.outputs.commit-count }}
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/toolkit-checkout@<generator-sha>
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/checkout@<generator-sha>
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/setup-uv@<generator-sha>
      - id: license-cache-key
        run: echo "license-cache-key=$(uv run --locked unity-license-tag)" >> "$GITHUB_OUTPUT"
      - id: commit-count
        run: echo "commit-count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - id: matrix
        run: uv run --locked build-unity-matrix | uv run --project "${{ runner.temp }}/github-actions-toolkit" --locked --no-dev matrix

  build-unity-build-unity:
    needs: [build-unity-plan-unity-builds]
    if: ${{ needs.gate.outputs.mode == 'full' }}
    runs-on:
      - self-hosted
      - unity
    container: ${{ matrix.editor-image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-unity-plan-unity-builds.outputs.matrix) }}
    steps:
      - name: Wipe workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete; rm -rf ~/.cache/Unity
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/checkout@<generator-sha>
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/setup-uv@<generator-sha>
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: >-
          uv run --locked build-unity
          --project "$PROJECT"
          --platform "$PLATFORM"
          --version "$VERSION"
          --channel "$CHANNEL"
          --pr-number "$PR_NUMBER"
          --commit-count "$COMMIT_COUNT"
          --license-cache-key "$LICENSE_CACHE_KEY"
          --registry "$REGISTRY"
        env:
          PROJECT: ${{ matrix.project }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ matrix.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_COUNT: ${{ needs.build-unity-plan-unity-builds.outputs.commit-count }}
          LICENSE_CACHE_KEY: ${{ needs.build-unity-plan-unity-builds.outputs.license-cache-key }}
          CHANNEL: pr
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          CI_ANDROID_KEYSTORE: ${{ secrets.CI_ANDROID_KEYSTORE }}
          CI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CI_ANDROID_KEYSTORE_PASSWORD }}
          CI_ANDROID_KEY_ALIAS: ${{ secrets.CI_ANDROID_KEY_ALIAS }}
          CI_ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.CI_ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REGISTRY: ghcr.io/${{ github.repository }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}

  openapi-drift-check:
    needs: [gate, preflight]
    if: ${{ needs.gate.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/checkout@<generator-sha>
      - uses: outernet-foundation/github-actions-toolkit/.github/actions/setup-uv@<generator-sha>
      - run: uv run --locked openapi-client-codegen --config openapi-client-codegen.yaml --check

  release-pr-builds:
    needs: [gate, build-unity-build-unity, openapi-drift-check]
    if: ${{ !cancelled() && !failure() && (needs.build-unity-build-unity.result == 'success' && needs.openapi-drift-check.result == 'success' || needs.gate.outputs.mode == 'reuse') }}
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/release-pr-builds.yml@<generator-sha>
    permissions:
      contents: write
      packages: read

  merge-if-ready:
    needs: [gate, release-pr-builds]
    if: ${{ !cancelled() && !failure() && (needs.release-pr-builds.result == 'success' || needs.gate.outputs.mode == 'reuse') }}
    concurrency:
      group: merge
      queue: max
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/merge-if-ready.yml@<generator-sha>
    permissions:
      contents: write
      pull-requests: read
      packages: write
    secrets:
      merge-bot-token: ${{ secrets.MERGE_BOT_TOKEN }}
