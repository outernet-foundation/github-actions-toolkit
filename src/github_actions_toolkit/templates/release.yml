# generated by generate-github-workflows: edit publish.yml, not this file
name: Release

'on':
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  NUGET_USER: ${{ secrets.NUGET_USER }}
  PYTHONUNBUFFERED: "1"

jobs:
# __DEV_FAN__

  prerelease:
    needs: [__DEV_TAILS__]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/dev' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: read
      packages: read
    uses: __TOOLKIT__/.github/actions/release
    with:
      channel: dev

# __STABLE_FAN__

  release:
    needs: [__STABLE_TAILS__]
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
      pull-requests: read
      packages: write
    uses: __TOOLKIT__/.github/actions/release
    with:
      channel: stable
