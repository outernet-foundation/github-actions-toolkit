# generated by generate-github-workflows: edit publish.yml, not this file
name: Integrate

'on': # zizmor: ignore[dangerous-triggers] the fork-contribution lane wakes pull_request_target deliberately
  pull_request_target:
    branches: [dev]
    types: [labeled, synchronize, reopened, ready_for_review]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  gate:
    permissions:
      contents: write
      pull-requests: write
    uses: __TOOLKIT__/.github/workflows/gate.yml
  preflight:
    needs: [gate]
    if: ${{ needs.gate.outputs.mode == 'full' }}
    permissions:
      contents: read
    uses: __TOOLKIT__/.github/workflows/preflight.yml
# __IF_NOT_CONSUMER_SCRIPT__
    with:
      consumer-script: false
# __END__

# __FAN__

  release-pr-builds:
    needs: [gate__FAN_TAILS__]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.mode != 'idle' }}
    permissions:
      contents: write
      packages: read
    uses: __TOOLKIT__/.github/workflows/release-pr-builds.yml

  merge-if-ready:
    needs: [gate, release-pr-builds]
    if: ${{ !cancelled() && !failure() && (needs.release-pr-builds.result == 'success' || needs.gate.outputs.mode == 'reuse') }}
    permissions:
      contents: write
      pull-requests: read
      packages: write
    concurrency:
      group: merge
      queue: max
    uses: __TOOLKIT__/.github/workflows/merge-if-ready.yml
    with:
      retry-workflow: __RETRY_WORKFLOW__
    secrets:
      merge-bot-private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
