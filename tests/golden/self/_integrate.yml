# generated by generate-github-workflows: edit publish.yml, not this file
name: Integrate

'on': # zizmor: ignore[dangerous-triggers] the fork-contribution lane wakes pull_request_target deliberately
  pull_request_target:
    branches: [dev]
    types: [labeled, synchronize, reopened, ready_for_review]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  gate:
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/gate.yml
  preflight:
    needs: [gate]
    if: ${{ needs.gate.outputs.mode == 'full' }}
    permissions:
      contents: read
    uses: $/.github/workflows/preflight.yml

  mirror:
    needs:
    - gate
    - preflight
    if: ${{ needs.gate.outputs.mode == 'full' }}
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/mirror.yml

  build-unity-plan-builds:
    needs:
    - gate
    - preflight
    - mirror
    if: ${{ needs.gate.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - uses: $/.github/actions/checkout
    - id: matrix
      run: uv run --locked matrix
    permissions:
      contents: read
      packages: write

  build-unity-build:
    needs:
    - gate
    - preflight
    - mirror
    - build-unity-plan-builds
    if: ${{ needs.gate.outputs.mode == 'full' && (github.repository != 'example/excluded') }}
    runs-on:
    - self-hosted
    - unity
    steps:
    - run: uv run --locked build --channel "$CHANNEL"
      env:
        CHANNEL: pr
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
    permissions:
      contents: read
      packages: write

  openapi-drift-check:
    needs:
    - gate
    - preflight
    - mirror
    if: ${{ needs.gate.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
    - uses: $/.github/actions/toolkit-checkout
    - uses: $/.github/actions/setup-uv
    - run: uv run --locked openapi-client-codegen --config openapi-client-codegen.yaml --check

  release-pr-builds:
    needs: [gate, mirror, build-unity-build, openapi-drift-check]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.mode != 'idle' }}
    permissions:
      contents: write
      packages: read
    uses: $/.github/workflows/release-pr-builds.yml

  merge-if-ready:
    needs: [gate, release-pr-builds]
    if: ${{ !cancelled() && !failure() && (needs.release-pr-builds.result == 'success' || needs.gate.outputs.mode == 'reuse') }}
    permissions:
      contents: write
      pull-requests: read
      packages: write
    concurrency:
      group: merge
      queue: max
    uses: $/.github/workflows/merge-if-ready.yml
    with:
      retry-workflow: _retry.yml
    secrets:
      merge-bot-private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
